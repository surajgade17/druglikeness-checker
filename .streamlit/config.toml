## Install

```bash
python -m venv .venv
source .venv/bin/activate  # Windows: .venv\Scripts\activate
pip install -r requirements.txt
streamlit run app.py
```

## Deployment

This app is designed for deployment on Streamlit Community Cloud without extra setup.

1. Push this repository to GitHub.
2. Create a new app in Streamlit Community Cloud.
3. Connect the repository and choose `app.py` as the main file.
4. Ensure `requirements.txt` is present and includes the project dependencies.
5. Optionally set an environment variable named `DRUGLIKENESS_PRO_KEY` for Pro feature gating.

## Usage

- Paste a SMILES into the single-molecule form.
- Use the built-in example molecules or upload a CSV with a `smiles` column.
- Review the pass/fail rule badges and structural alerts.
- Download batch analysis results as a CSV.
- For Pro features, provide a valid key to unlock the premium stub.

## Pricing plan

- Free tier: up to 20 molecules per batch
- Pro tier: up to 5000 molecules, PDF export, and Tanimoto similarity search against a user-provided reference set
- Payment integration and billing are intentionally left as a TODO in this starter/open-source version.

## Limitations

- This tool is intended for research and educational use only.
- Structural alerts are heuristic filters; they do not replace medicinal chemistry review.
- Drug-likeness is not a guarantee of efficacy, safety, or clinical suitability.
- Some property calculations and alert systems are approximate and should be interpreted with domain expertise.

