# DrugLikeness Checker

A mobile-first Streamlit app for evaluating the drug-likeness and basic ADMET-style risk of small molecules directly from a SMILES string or a CSV file.

## Description

DrugLikeness Checker allows a user to paste a SMILES string or upload a CSV with a `smiles` column and instantly receive a report with:

- molecule properties (MW, cLogP, TPSA, HBD, HBA, rotatable bonds, rings, heavy atoms, QED, SA score)
- rule checks for Lipinski, Veber, Ghose, Egan, and Muegge
- structural alerts from PAINS and Brenk filters
- a radar chart and bar chart compared with ideal drug-like ranges
- batch processing in a free tier
- an optional Pro stub for larger workloads and advanced features

